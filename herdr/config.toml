onboarding = false

# Mirrors tmux/tmux.conf: same prefix, same split keys. vim/tmux do not run
# inside herdr, so sharing ctrl+space is safe. Pane focus (prefix+h/j/k/l),
# tabs (prefix+c/n/p/1..9), close (prefix+x) and zoom (prefix+z) already match
# tmux by default.
[keys]
prefix = "ctrl+space"
split_vertical = "prefix+'"
split_horizontal = 'prefix+"'

[ui]
mouse_capture = true
